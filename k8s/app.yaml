apiVersion: apps/v1
kind: Deployment
metadata:
name: web-app-deployment
labels:
app: web-app
spec:
replicas: 2
selector:
matchLabels:
app: web-app
template:
metadata:
labels:
app: web-app
spec:
containers:
- name: web-app
image: node:18-alpine
command: [&quot;/bin/sh&quot;, &quot;-c&quot;]
args:
- npm install &amp;&amp; node app.js
env:
- name: DB_HOST
value: postgres-service
- name: DB_USER
value: postgres
- name: DB_PASSWORD
value: postgres123
- name: DB_NAME
value: myapp
ports:
- containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
name: web-app-loadbalancer
annotations:
service.beta.kubernetes.io/oci-load-balancer-internal: &quot;false&quot;
spec:
type: LoadBalancer
ports:
- port: 80
targetPort: 3000
selector:
app: web-app
